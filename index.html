<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mega Game Football 3D</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07130c;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#hud {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    color: white;
    font-weight: 900;
    text-shadow: 0 2px 4px #000;
    background: #07101dcc;
    padding: 9px 16px;
    border: 1px solid #ffffff55;
    border-radius: 14px;
    z-index: 2;
}

#help {
    position: fixed;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: #07101d99;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
}

#joy {
    position: fixed;
    left: 22px;
    bottom: 24px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #ffffff28;
    border: 3px solid #ffffff88;
    touch-action: none;
}

#knob {
    position: absolute;
    width: 54px;
    height: 54px;
    left: 32px;
    top: 32px;
    border-radius: 50%;
    background: #eaf4ffcc;
    border: 3px solid white;
}

.actions {
    position: fixed;
    right: 20px;
    bottom: 28px;
    display: flex;
    flex-direction: column;
    gap: 13px;
}

button {
    border: 3px solid #ffffffaa;
    border-radius: 50%;
    width: 82px;
    height: 82px;
    color: white;
    font-weight: 900;
    font-size: 15px;
    box-shadow: 0 5px 0 #0005;
    text-shadow: 0 1px 3px #000;
    touch-action: manipulation;
}

#pass {
    background: #0879d9;
}

#shoot {
    background: #19a43d;
}

#sprint {
    background: #c32222;
}

#start {
    position: fixed;
    inset: 0;
    background: linear-gradient(#04111dcc, #04111d99);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    color: white;
    text-align: center;
}

.card {
    background: #071b30ee;
    border: 2px solid #ffffff55;
    border-radius: 22px;
    padding: 28px 24px;
    max-width: 90vw;
}

h1 {
    font-size: clamp(28px, 7vw, 52px);
    margin: 0 0 8px;
    color: #ffcf22;
    font-style: italic;
    text-shadow: 0 4px #713b00;
}

.card p {
    line-height: 1.5;
    color: #e2f1ff;
}

#play {
    width: auto;
    height: auto;
    border-radius: 12px;
    padding: 15px 35px;
    background: #ffb900;
    color: #111;
    font-size: 22px;
    border: 0;
    text-shadow: none;
}

@media(min-width:700px) {
    #joy {
        width: 145px;
        height: 145px;
    }

    #knob {
        left: 42px;
        top: 42px;
    }

    .actions {
        flex-direction: row;
        bottom: 22px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <span id="blue">BLUE 0</span>
    <span>—</span>
    <span id="clock">00:00</span>
    <span>—</span>
    <span id="red">RED 0</span>
</div>

<div id="help">MOVE • PASS • SHOOT • SPRINT</div>

<div id="joy">
    <div id="knob"></div>
</div>

<div class="actions">
    <button id="pass">PASS</button>
    <button id="shoot">SHOOT</button>
    <button id="sprint">SPRINT</button>
</div>

<div id="start">
    <div class="card">
        <h1>MEGA GAME<br>FOOTBALL 3D</h1>

        <p>
            Top-down mobile football<br>
            Control the blue team.
            Your teammates and opponents play with AI.
        </p>

        <button id="play">▶ PLAY MATCH</button>
    </div>
</div>

<script>
(() => {

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, dpr, scale = 1;
let started = false;
let time = 0;
let blueScore = 0;
let redScore = 0;

function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min(W / 900, H / 560);
}

addEventListener('resize', resize);
resize();

const field = {
    x: 70,
    y: 55,
    w: 760,
    h: 450
};

const teams = [[], []];

let ball = {
    x: 450,
    y: 280,
    vx: 0,
    vy: 0,
    owner: null
};

function player(team, x, y, i) {
    return {
        team,
        x,
        y,
        homeX: x,
        homeY: y,
        i,
        vx: 0,
        vy: 0,
        stamina: 1
    };
}

for (let i = 0; i < 6; i++) {
    teams[0].push(
        player(0, 160 + (i % 2) * 95, 100 + i * 65, i)
    );

    teams[1].push(
        player(1, 740 - (i % 2) * 95, 100 + i * 65, i)
    );
}

teams[0][0].x = 380;
teams[0][0].y = 280;

teams[1][0].x = 520;
teams[1][0].y = 280;

let controlled = teams[0][0];
ball.owner = controlled;

const joy = document.getElementById('joy');
const knob = document.getElementById('knob');

let input = {
    x: 0,
    y: 0
};

let joyId = null;
let sprinting = false;

function joyMove(e) {
    const r = joy.getBoundingClientRect();

    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    let dx = e.clientX - cx;
    let dy = e.clientY - cy;

    const m = Math.hypot(dx, dy);
    const max = r.width * 0.34;

    if (m > max) {
        dx *= max / m;
        dy *= max / m;
    }

    input.x = dx / max;
    input.y = dy / max;

    knob.style.left =
        (r.width / 2 - 27 + dx) + 'px';

    knob.style.top =
        (r.height / 2 - 27 + dy) + 'px';
}

joy.addEventListener('pointerdown', e => {
    joyId = e.pointerId;
    joy.setPointerCapture(joyId);
    joyMove(e);
});

joy.addEventListener('pointermove', e => {
    if (e.pointerId === joyId) {
        joyMove(e);
    }
});

function joyEnd() {
    joyId = null;

    input = {
        x: 0,
        y: 0
    };

    knob.style.left =
        (joy.clientWidth / 2 - 27) + 'px';

    knob.style.top =
        (joy.clientHeight / 2 - 27) + 'px';
}

joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);

document.getElementById('sprint').onpointerdown = () => {
    sprinting = true;
};

document.getElementById('sprint').onpointerup = () => {
    sprinting = false;
};

document.getElementById('sprint').onpointercancel = () => {
    sprinting = false;
};

function kick(power, pass) {

    if (!ball.owner) return;

    const p = ball.owner;

    let dirx = input.x;
    let diry = input.y;

    if (Math.hypot(dirx, diry) < 0.2) {
        dirx = p.team === 0 ? 1 : -1;
        diry = 0;
    }

    if (pass) {
        const mate = teams[p.team]
            .filter(q => q !== p)
            .sort((a, b) =>
                Math.hypot(a.x - p.x, a.y - p.y) -
                Math.hypot(b.x - p.x, b.y - p.y)
            )[0];

        if (mate) {
            dirx = mate.x - p.x;
            diry = mate.y - p.y;
        }
    }

    const m = Math.hypot(dirx, diry) || 1;

    ball.owner = null;

    ball.vx = dirx / m * power;
    ball.vy = diry / m * power;

    controlled = p;
}

document.getElementById('pass').onclick = () => {
    kick(340, true);
};

document.getElementById('shoot').onclick = () => {
    kick(560, false);
};

function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
}

function update(dt) {

    time += dt;

    for (let t = 0; t < 2; t++) {

        for (let p of teams[t]) {

            let dx = 0;
            let dy = 0;

            if (p === controlled) {
                dx = input.x;
                dy = input.y;
            }

            else if (ball.owner === p) {
                dx = t === 0 ? 1 : -1;
                dy = (280 - p.y) * 0.003;
            }

            else if (ball.owner && ball.owner.team === t) {
                dx = (p.homeX - p.x) * 0.015;
                dy = (p.homeY - p.y) * 0.015;
            }

            else {
                const target = ball.owner || ball;

                dx = (target.x - p.x) * 0.012;
                dy = (target.y - p.y) * 0.012;

                if (t === 0 && p.x < field.x + 180) {
                    dx += 0.25;
                }

                if (t === 1 &&
                    p.x > field.x + field.w - 180) {
                    dx -= 0.25;
                }
            }

            const speed =
                p === controlled
                    ? (sprinting ? 205 : 150)
                    : 115;

            const m = Math.hypot(dx, dy);

            if (m > 1) {
                dx /= m;
                dy /= m;
            }

            p.x += dx * speed * dt;
            p.y += dy * speed * dt;

            p.x = clamp(
                p.x,
                field.x + 12,
                field.x + field.w - 12
            );

            p.y = clamp(
                p.y,
                field.y + 12,
                field.y + field.h - 12
            );
        }
    }

    if (ball.owner) {

        ball.x =
            ball.owner.x +
            (ball.owner.team === 0 ? 13 : -13);

        ball.y = ball.owner.y + 5;

    } else {

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        ball.vx *= Math.pow(0.985, dt * 60);
        ball.vy *= Math.pow(0.985, dt * 60);

        if (
            ball.y < field.y + 8 ||
            ball.y > field.y + field.h - 8
        ) {
            ball.vy *= -0.8;
        }

        if (
            ball.x < field.x + 8 ||
            ball.x > field.x + field.w - 8
        ) {

            if (Math.abs(ball.y - 280) < 55) {

                if (ball.x < field.x) {
                    redScore++;
                } else {
                    blueScore++;
                }

                resetBall();

            } else {
                ball.vx *= -0.8;
            }
        }

        for (let t = 0; t < 2; t++) {

            for (let p of teams[t]) {

                if (
                    Math.hypot(
                        p.x - ball.x,
                        p.y - ball.y
                    ) < 19
                ) {
                    ball.owner = p;
                    ball.vx = 0;
                    ball.vy = 0;
                }
            }
        }
    }

    document.getElementById('blue').textContent =
        'BLUE ' + blueScore;

    document.getElementById('red').textContent =
        'RED ' + redScore;

    document.getElementById('clock').textContent =
        String(Math.floor(time / 60)).padStart(2, '0') +
        ':' +
        String(Math.floor(time % 60)).padStart(2, '0');
}

function resetBall() {

    ball.x = 450;
    ball.y = 280;

    ball.vx = 0;
    ball.vy = 0;

    ball.owner = teams[0][0];

    for (let t = 0; t < 2; t++) {

        teams[t].forEach((p, i) => {
            p.x = p.homeX;
            p.y = p.homeY;
        });
    }
}

function draw() {

    ctx.clearRect(0, 0, W, H);

    const s = Math.min(W / 900, H / 560);

    const ox = (W - 900 * s) / 2;
    const oy = (H - 560 * s) / 2;

    ctx.save();

    ctx.translate(ox, oy);
    ctx.scale(s, s);

    ctx.fillStyle = '#102719';
    ctx.fillRect(0, 0, 900, 560);

    ctx.fillStyle = '#176b2c';
    ctx.fillRect(45, 30, 810, 500);

    for (let i = 0; i < 10; i++) {

        ctx.fillStyle =
            i % 2 ? '#208239' : '#269341';

        ctx.fillRect(
            45 + i * 81,
            30,
            81,
            500
        );
    }

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;

    ctx.strokeRect(45, 30, 810, 500);

    ctx.beginPath();
    ctx.moveTo(450, 30);
    ctx.lineTo(450, 530);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(450, 280, 68, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeRect(45, 175, 130, 210);
    ctx.strokeRect(725, 175, 130, 210);

    ctx.strokeRect(45, 225, 55, 110);
    ctx.strokeRect(800, 225, 55, 110);

    ctx.fillStyle = '#eee';

    ctx.fillRect(25, 230, 20, 100);
    ctx.fillRect(855, 230, 20, 100);

    for (let t = 0; t < 2; t++) {

        for (let p of teams[t]) {

            ctx.fillStyle = '#0005';

            ctx.beginPath();
            ctx.ellipse(
                p.x + 3,
                p.y + 8,
                13,
                7,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle =
                t === 0 ? '#1476ff' : '#ed3030';

            ctx.beginPath();
            ctx.ellipse(
                p.x,
                p.y,
                12,
                16,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = '#fff';

            ctx.beginPath();
            ctx.arc(p.x, p.y - 9, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';

            ctx.fillText(
                p.i + 1,
                p.x,
                p.y + 4
            );

            if (p === controlled) {

                ctx.strokeStyle = '#ffe34b';
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 19, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }

    ctx.fillStyle = '#0005';

    ctx.beginPath();
    ctx.ellipse(
        ball.x + 3,
        ball.y + 6,
        9,
        5,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#fff';

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    requestAnimationFrame(draw);
}

let prev = 0;

function loop(ts) {

    let dt = Math.min((ts - prev) / 1000, 0.04);

    prev = ts;

    if (started) {
        update(dt);
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
draw();

document.getElementById('play').onclick = () => {

    started = true;

    document.getElementById('start').style.display = 'none';
};

})();
</script>

</body>
</html>
